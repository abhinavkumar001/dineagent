app:
  llm:
    provider: offline
    gemini:
      api-key: ""
      model: gemini-2.5-flash
      embedding-model: gemini-embedding-001
      timeout-seconds: 5
  agent:
    max-steps: 6
  timezone: Asia/Kolkata
  order:
    # 1 = real time; 10 = a 30-minute delivery plays out in 3 minutes (good for demos)
    time-scale: 1
  realtime:
    order-tick-ms: 3000
  razorpay:
    # Test-mode keys from dashboard.razorpay.com -> Account & Settings -> API Keys. Leave empty for pay on delivery.
    key-id: ""
    key-secret: ""
    webhook-secret: ""
